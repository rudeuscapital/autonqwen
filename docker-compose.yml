version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # GPU support (uncomment if you have NVIDIA GPU):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  app:
    build: .
    container_name: autonqwen
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - NODE_ENV=production
      - OLLAMA_URL=http://ollama:11434
      - DEFAULT_MODEL=qwen3:1.7b
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-secure-random-string-32ch}
      - MEMORY_DIR=/app/memory
      - UPLOAD_DIR=/app/uploads
    volumes:
      - app_memory:/app/memory
      - app_uploads:/app/uploads
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
  app_memory:
  app_uploads:
